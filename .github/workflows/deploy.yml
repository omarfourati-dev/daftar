name: CI & Deploy – daftar.omarfourati.de

# No pull_request trigger: code from forks must never run on the self-hosted runner.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production-daftar
  cancel-in-progress: false

env:
  DEPLOY_DIR: /home/daftar

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    environment: production
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Sync code to deploy directory
        run: |
          mkdir -p "$DEPLOY_DIR"
          rsync -rlD --no-owner --no-group --delete --exclude='.git' --exclude='.env' --exclude='web/node_modules' \
            --exclude='web/build' --exclude='backend/.venv' "$GITHUB_WORKSPACE/" "$DEPLOY_DIR/"

      - name: Ensure Docker network 'web' exists
        run: docker network create web 2>/dev/null || echo "Network 'web' already exists."

      - name: Create database role and database
        # The password reaches psql as an inherited environment variable and is read with \getenv,
        # so it never appears in a command line, process list or log.
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -z "$DB_PASSWORD" ]; then echo "::error::Secret DB_PASSWORD is missing"; exit 1; fi
          case "$DB_PASSWORD" in *[!A-Za-z0-9_-]*) echo "::error::DB_PASSWORD must be URL-safe (letters, digits, _ and -)"; exit 1;; esac
          docker exec -i -e DB_PASSWORD zentrades-postgres psql -v ON_ERROR_STOP=1 -U zentrades -d postgres <<'SQL'
          \getenv pw DB_PASSWORD
          SELECT format('CREATE ROLE daftar LOGIN PASSWORD %L', :'pw')
            WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'daftar') \gexec
          SELECT format('ALTER ROLE daftar PASSWORD %L', :'pw') \gexec
          SELECT 'CREATE DATABASE daftar OWNER daftar'
            WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'daftar') \gexec
          SQL

      - name: Write .env
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          FLOUCI_APP_TOKEN: ${{ secrets.FLOUCI_APP_TOKEN }}
          FLOUCI_APP_SECRET: ${{ secrets.FLOUCI_APP_SECRET }}
        run: |
          if [ ${#JWT_SECRET} -lt 32 ]; then echo "::error::Secret JWT_SECRET is missing or too short"; exit 1; fi
          [ -z "$ADMIN_EMAIL" ] && echo "::warning::Variable ADMIN_EMAIL missing – no admin account is created"
          { [ -z "$FLOUCI_APP_TOKEN" ] || [ -z "$FLOUCI_APP_SECRET" ]; } && echo "::warning::Flouci secrets missing – online payment stays off"
          {
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            [ -n "$ADMIN_EMAIL" ] && printf 'ADMIN_EMAIL=%s\n' "$ADMIN_EMAIL"
            [ -n "$ADMIN_PASSWORD" ] && printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD"
            [ -n "$BASE_DOMAIN" ] && printf 'BASE_DOMAIN=%s\n' "$BASE_DOMAIN"
            [ -n "$FLOUCI_APP_TOKEN" ] && printf 'FLOUCI_APP_TOKEN=%s\n' "$FLOUCI_APP_TOKEN"
            [ -n "$FLOUCI_APP_SECRET" ] && printf 'FLOUCI_APP_SECRET=%s\n' "$FLOUCI_APP_SECRET"
            true
          } > "$DEPLOY_DIR/.env"
          chmod 600 "$DEPLOY_DIR/.env"

      - name: Build and start
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          docker compose -f docker-compose.prod.yml build
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

      - name: Wait for health
        run: |
          for i in $(seq 1 24); do
            [ "$(docker inspect --format='{{.State.Health.Status}}' daftar 2>/dev/null)" = "healthy" ] && { echo healthy; exit 0; }
            sleep 10
          done
          docker logs daftar --tail=80; exit 1

      - name: Reload Caddy
        run: docker compose -f /opt/caddy/docker-compose.yml exec caddy caddy reload --config /etc/caddy/Caddyfile

      - name: Clean up dangling images
        run: docker image prune -f
