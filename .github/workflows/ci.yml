name: CI

# GitHub-hosted runners only; pull requests (also from forks) never reach the self-hosted runner.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend – pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: daftar_test, POSTGRES_USER: daftar, POSTGRES_PASSWORD: daftar }
        ports: ["55436:5432"]
        options: >-
          --health-cmd "pg_isready -U daftar -d daftar_test" --health-interval 3s --health-retries 20
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
        env: { TEST_DATABASE_URL: "postgresql+psycopg://daftar:daftar@localhost:55436/daftar_test" }

  web:
    name: Web – check, test and build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run check   # svelte-kit sync + svelte-check
      - run: npx vitest run
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - name: Throwaway secrets for the CI stack
        run: |
          jwt=$(openssl rand -hex 32); pw=$(openssl rand -hex 16)
          echo "::add-mask::$jwt"; echo "::add-mask::$pw"
          { echo "JWT_SECRET=$jwt"; echo "ADMIN_PASSWORD=$pw"; echo "E2E_ADMIN_PASSWORD=$pw"; } >> "$GITHUB_ENV"
      - name: Start stack
        run: |
          docker compose --profile app up -d --build
          for i in $(seq 1 60); do curl -fs http://localhost:18083/healthz && exit 0; sleep 3; done
          docker compose --profile app logs app | tail -80; exit 1
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Run Playwright
        working-directory: web
        env: { CI: "true", E2E_BASE_URL: "http://localhost:18083", E2E_ADMIN_EMAIL: "admin@daftar.test" }
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - name: App logs
        if: failure()
        run: docker compose --profile app logs app | tail -200
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: web/playwright-report, retention-days: 7 }
