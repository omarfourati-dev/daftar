[project]
name = "daftar"
version = "0.1.0"
description = "Daftar – agenda du cabinet dentaire (backend)"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
