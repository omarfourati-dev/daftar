# Local development and CI.
#   docker compose up -d postgres                      → database only (port 55436, DB daftar)
#   docker compose --profile app up -d --build         → the whole app on http://localhost:18083
# BASE_DOMAIN=localhost: practice sub-domains work as http://<slug>.localhost:18083 (browsers resolve *.localhost).
services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: daftar, POSTGRES_USER: daftar, POSTGRES_PASSWORD: daftar }
    ports: ["127.0.0.1:${POSTGRES_PORT:-55436}:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U daftar -d daftar"], interval: 3s, retries: 20 }

  app:
    profiles: [app]
    build: .
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["127.0.0.1:${APP_PORT:-18083}:8080"]
    environment:
      DATABASE_URL: postgresql+psycopg://daftar:daftar@postgres:5432/daftar
      JWT_SECRET: ${JWT_SECRET:-local-development-only-jwt-secret-0123456789}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@daftar.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-local-admin-password-123}
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
